<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>ITS_MYGO · AGENT GALAXY</title>
<style>
  :root {
    --bg0:#02040b; --bg1:#050a18; --bg2:#071225;

  html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#02040b; color:var(--ink); }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;

    user-select: none;
  }
  #space { position:fixed; inset:0; width:100%; height:100%; display:block; }
  #vignette {
    position:fixed; inset:0; pointer-events:none; z-index:2;

  }
  #grain {
    position:fixed; inset:0; z-index:3; pointer-events:none; opacity:.045;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/></svg>");
  }

  /* ── HUD shell ─────────────────────────────────── */
  header {
    position:fixed; z-index:10; top:18px; left:22px; right:22px;

  .brand { display:flex; align-items:center; gap:13px; min-width:0; }
  .brand-mark {

    border:1px solid rgba(103,232,249,.38);

  .header-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .search {

  .search:focus-within { border-color:rgba(103,232,249,.55); box-shadow:0 0 0 3px rgba(103,232,249,.08); }
  .search svg { width:14px; height:14px; flex:0 0 auto; opacity:.6; }
  .search input {

  button {

  button.active { color:#03111b; background:linear-gradient(100deg,var(--cyan),var(--teal)); border-color:transparent; box-shadow:0 0 22px rgba(103,232,249,.24); }
  button svg { width:13px; height:13px; }

  /* ── left legend ────────────────────────────────── */
  #legend {
    position:fixed; z-index:9; left:22px; bottom:52px; width:212px;

    background:linear-gradient(180deg,rgba(7,15,30,.18),rgba(4,9,20,.26));
    backdrop-filter:blur(20px) saturate(135%); -webkit-backdrop-filter:blur(20px) saturate(135%); padding:12px 12px 10px;
    box-shadow:0 18px 50px rgba(0,0,0,.2);
  }
  .legend-title {
    display:flex; justify-content:space-between; align-items:center;
    font-size:9px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase;
    padding-bottom:9px; border-bottom:1px solid rgba(120,170,255,.12); margin-bottom:8px;
  }
  .legend-title span:last-child { color:var(--dim); letter-spacing:.08em; }
  .legend-item {
    display:flex; align-items:center; gap:9px; padding:5px 6px; border-radius:6px;
    cursor:pointer; transition:background .16s,opacity .16s;
  }
  .legend-item:hover { background:rgba(120,170,255,.07); }
  .legend-item.muted { opacity:.28; }
  .legend-dot { width:7px; height:7px; border-radius:50%; box-shadow:0 0 9px currentColor; flex:0 0 auto; }
  .legend-name { font-size:11px; color:#b8cae6; flex:1; letter-spacing:.02em; }
  .legend-count { font-size:9px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .legend-tip {
    margin-top:8px; padding-top:8px; border-top:1px solid rgba(120,170,255,.1);
    color:#5f7394; font-size:9px; line-height:1.7; letter-spacing:.02em;
  }
  .legend-tip b { color:var(--gold); font-weight:500; }

  /* ── bottom HUD ─────────────────────────────────── */
  #hud {
    position:fixed; z-index:9; right:22px; bottom:20px; display:flex; align-items:center; gap:13px;
    color:#5f7394; font-size:10px; letter-spacing:.06em; pointer-events:none;
  }
  #hud .stat b { color:#bcd2ee; font-weight:600; }
  #hud .sep { width:1px; height:10px; background:rgba(120,170,255,.18); }
  #hints {
    position:fixed; z-index:9; left:50%; bottom:20px; transform:translateX(-50%);
    color:#536785; font-size:10px; letter-spacing:.08em; white-space:nowrap; pointer-events:none;
  }
  #hints b { color:#9db6d8; font-weight:500; }
  #pulse {
    position:fixed; z-index:9; left:22px; bottom:20px; display:flex; align-items:center; gap:8px;
    color:#5a708f; font-size:9px; letter-spacing:.14em; pointer-events:none;
  }
  #pulse i {
    width:5px; height:5px; border-radius:50%; background:var(--green);
    box-shadow:0 0 10px var(--green); animation:blink 2.2s infinite;
  }
  @keyframes blink { 0%,100%{opacity:.35} 50%{opacity:1} }

  /* ── tooltip ────────────────────────────────────── */
  #tooltip {
    position:fixed; z-index:30; pointer-events:none; opacity:0; transform:translateY(4px);
    transition:opacity .14s, transform .14s; max-width:280px;
    background:rgba(6,13,27,.72); border:1px solid rgba(120,190,255,.3);
    border-radius:9px; padding:9px 11px; box-shadow:0 12px 34px rgba(0,0,0,.36);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  }
  #tooltip.show { opacity:1; transform:translateY(0); }
  #tooltip .tt-cat { font-size:8px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:4px; }
  #tooltip .tt-name { font-size:12px; color:#eef8ff; font-weight:600; margin-bottom:3px; }
  #tooltip .tt-tech { font-size:10px; color:#8da7c9; line-height:1.5; }
  #tooltip .tt-hint { margin-top:7px; padding-top:6px; border-top:1px solid rgba(120,170,255,.16); color:#5c7293; font-size:9px; }

  /* ── detail panel ───────────────────────────────── */
  #panel {
    position:fixed; z-index:20; top:78px; right:22px; bottom:22px; width:min(470px, calc(100vw - 44px));
    display:flex; flex-direction:column;
    border:1px solid rgba(150,210,255,.22); border-radius:14px;
    background:linear-gradient(180deg,rgba(9,18,36,.1),rgba(5,11,24,.16));
    box-shadow:0 28px 80px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter:blur(16px) saturate(150%); -webkit-backdrop-filter:blur(16px) saturate(150%);
    transform:translateX(calc(100% + 30px)); opacity:0; pointer-events:none;
    transition:transform .34s cubic-bezier(.2,.8,.2,1), opacity .24s;
    overflow:hidden;
  }
  #panel.open { transform:translateX(0); opacity:1; pointer-events:auto; }
  .panel-head { padding:17px 18px 13px; border-bottom:1px solid rgba(120,170,255,.12); position:relative; flex:0 0 auto; }  .panel-head::before {
    content:""; position:absolute; left:18px; right:18px; top:0; height:1px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.8;
  }
  .panel-kicker { display:flex; align-items:center; gap:8px; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent); }
  .panel-kicker .dot { width:5px; height:5px; border-radius:50%; background:var(--accent); box-shadow:0 0 9px var(--accent); }
  .panel-close {
    position:absolute; top:12px; right:12px; width:28px; height:28px; padding:0; justify-content:center;
    border-radius:7px; background:rgba(255,255,255,.03);
  }
  .panel-title { margin-top:9px; font-size:22px; font-weight:700; letter-spacing:.02em; color:#f3faff; line-height:1.25; }
  .panel-sub { margin-top:4px; font-size:11px; color:#88a0c2; letter-spacing:.04em; }
  .panel-body { padding:15px 18px 22px; overflow:auto; flex:1 1 auto; scrollbar-width:thin; scrollbar-color:rgba(120,170,255,.3) transparent; overscroll-behavior:contain; }  .panel-body::-webkit-scrollbar { width:6px; }
  .panel-body::-webkit-scrollbar-thumb { background:rgba(120,170,255,.26); border-radius:3px; }
  .panel-body::-webkit-scrollbar-track { background:transparent; }
  .panel-desc { font-size:12px; line-height:1.85; color:#d1e3f8; margin:0 0 14px; text-shadow:0 1px 3px rgba(0,0,0,.65); }
  .panel-desc strong { color:#fff; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:15px; }
  .chip {
    display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:5px;
    border:1px solid color-mix(in srgb,var(--accent) 35%, transparent);
    background:color-mix(in srgb,var(--accent) 7%, transparent);
    color:#cfe8f7; font-size:10px; line-height:1.2; letter-spacing:.02em;
  }
  .chip.related { cursor:pointer; border-color:rgba(120,170,255,.22); background:rgba(120,170,255,.05); color:#a9c1df; }
  .chip.related:hover { border-color:var(--accent); color:#fff; }
  .sec-label { display:flex; align-items:center; gap:8px; margin:16px 0 8px; font-size:9px; color:#7188a8; letter-spacing:.16em; text-transform:uppercase; }
  .sec-label::after { content:""; flex:1; height:1px; background:rgba(120,170,255,.1); }
  .file-row {
    display:flex; align-items:flex-start; gap:8px; padding:7px 9px; border-radius:6px;
    background:rgba(120,170,255,.08); border:1px solid rgba(120,170,255,.16);
    font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace; font-size:10px;
    color:#b8d2f0; word-break:break-all; line-height:1.55;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
  }
  .file-row svg { width:12px; height:12px; flex:0 0 auto; margin-top:1px; opacity:.7; }
  .code-block { border:1px solid rgba(120,170,255,.2); border-radius:8px; overflow:hidden; margin:8px 0 12px; background:rgba(2,7,15,.14); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .code-block summary {
    cursor:pointer; list-style:none; padding:8px 11px; display:flex; align-items:center; gap:8px;
    color:#8ca7c8; font-size:10px; letter-spacing:.02em; border-bottom:1px solid transparent;
    background:rgba(120,170,255,.035);
  }
  .code-block[open] summary { border-bottom-color:rgba(120,170,255,.1); color:#c5dcf4; }
  .code-block summary::-webkit-details-marker { display:none; }
  .code-block summary .arrow { margin-left:auto; transition:transform .18s; font-size:9px; color:#5f7595; }
  .code-block[open] summary .arrow { transform:rotate(90deg); }
  .code-block pre { margin:0; padding:11px 12px; overflow:auto; max-height:420px; scrollbar-width:thin; scrollbar-color:rgba(120,170,255,.34) transparent; overscroll-behavior:contain; }
  .code-block pre::-webkit-scrollbar { width:7px; height:7px; }
  .code-block pre::-webkit-scrollbar-thumb { background:rgba(120,170,255,.3); border-radius:4px; }
  .code-block pre::-webkit-scrollbar-track { background:rgba(120,170,255,.04); }
  .code-block code { font-family:"Cascadia Code","SFMono-Regular",Consolas,monospace; font-size:10px; line-height:1.65; color:#b8d2ee; white-space:pre; }

  .talk {

    background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%, transparent),transparent);

  /* ── responsive ─────────────────────────────────── */
  @media (max-width: 1000px) {
    header { top:12px; left:14px; right:14px; }

    .header-actions button span { display:none; }

    .panel-title { font-size:19px; }

<canvas id="space"></canvas>

<div id="grain"></div>

<header>
  <div class="brand">

    <div>
      <h1>ITS MY GO GALAXY</h1>
      <div class="sub">ITS_MYGO · 一次买够 / 项目逻辑星图 · <b>LIVE MAP</b></div>
    </div>
  </div>

      <input id="search" type="text" placeholder="搜索节点 / 技术 / 文件…" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </div>
    <button id="auto" class="active" title="自动旋转">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span>自动旋转</span>
    </button>
    <button id="tour" title="按主链路巡游">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg><span>主线巡游</span>
    </button>
    <button id="reset" title="重置视角">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v7h7"/></svg><span>重置</span>
    </button>
  </div>
</header>

<aside id="legend">

</aside>

<aside id="panel" aria-live="polite"></aside>

<div id="tooltip"></div>

<div id="hud">
  <div class="stat"><b id="stat-nodes">0</b> NODES</div>
  <div class="sep"></div>
  <div class="stat"><b id="stat-links">0</b> LINKS</div>
  <div class="sep"></div>
  <div class="stat">ZOOM <b id="stat-zoom">1.0</b>×</div>
</div>
<div id="hints"><b>拖拽</b> 旋转星图 &nbsp;·&nbsp; <b>滚轮</b> 缩放 &nbsp;·&nbsp; <b>点击节点</b> 展开实现 &nbsp;·&nbsp; <b>空格</b> 暂停旋转</div>

        "code": "    public <T> T getOrLoad(String key, Duration baseTtl, Class<T> type, Supplier<T> loader) {\n        String cached = redisTemplate.opsForValue().get(key);\n        if (cached != null) {\n            try {\n                return objectMapper.readValue(cached, type);\n            } catch (Exception e) {\n                // 缓存内容坏了（格式变更、人工改坏）—— 删掉重来，别让请求失败\n                log.warn(\"缓存反序列化失败，将删除重建: {}\", key);\n                redisTemplate.delete(key);\n            }\n        }\n\n        String lockKey = key + \":loading\";\n        Boolean gotLock = redisTemplate.opsForValue().setIfAbsent(lockKey, \"1\", LOAD_LOCK_TTL);\n\n        if (Boolean.TRUE.equals(gotLock)) {\n            try {\n                // 双重检查：抢锁期间别人可能已经写好了\n                String loaded = redisTemplate.opsForValue().get(key);\n                if (loaded != null) {\n                    return objectMapper.readValue(loaded, type);\n                }\n                T value = loader.get();\n                if (value != null) {\n                    redisTemplate.opsForValue().set(key, objectMapper.writeValueAsString(value), jittered(baseTtl));\n                }\n                return value;\n            } finally {\n                redisTemplate.delete(lockKey);\n            }\n        }\n\n        // 没抢到锁 —— 别人正在加载，等它写好即可，绝不能也去回源\n        for (int round = 0; round < MAX_WAIT_ROUNDS; round++) {\n            sleep();\n            String loaded = redisTemplate.opsForValue().get(key);\n            if (loaded != null) {\n                return objectMapper.readValue(loaded, type);\n            }\n        }\n        // 等不到（Redis 或数据库可能有问题）：直接回源，保证功能可用，不把请求打挂\n        log.warn(\"等待缓存加载超时，本次直接回源: {}\", key);\n        return loader.get();\n    }\n\n    /** 数据变更后调用 —— 删缓存而不是更新缓存 */\n    public void evict(String key) {\n        redisTemplate.delete(key);\n    }\n\n    /** TTL 加随机抖动（±20%），防止一批 key 在同一秒集体过期（缓存雪崩） */\n    private Duration jittered(Duration base) {\n        long baseSeconds = base.toSeconds();\n        long jitter = ThreadLocalRandom.current().nextLong(-baseSeconds / 5, baseSeconds / 5 + 1);\n        return Duration.ofSeconds(baseSeconds + jitter);"

        "code": "    private static final Duration TTL = Duration.ofDays(7);\n\n    /** 一次往返把 6 个 bit 全写上并续期，避免 6 次网络调用。ARGV[1] 是 TTL，其后是各位的偏移 */\n    private static final RedisScript<List> ADD_SCRIPT = new DefaultRedisScript<>(\"\"\"\n            redis.call('EXPIRE', KEYS[1], ARGV[1])\n            for i = 2, #ARGV do\n                redis.call('SETBIT', KEYS[1], ARGV[i], 1)\n            end\n            return {1}\n            \"\"\", List.class);\n\n    private static final RedisScript<List> MIGHT_CONTAIN_SCRIPT = new DefaultRedisScript<>(\"\"\"\n            for i = 1, #ARGV do\n                if redis.call('GETBIT', KEYS[1], ARGV[i]) == 0 then\n                    return {0}\n                end\n            end\n            return {1}\n            \"\"\", List.class);\n\n    private final StringRedisTemplate redisTemplate;\n    private final ProductMapper productMapper;\n\n    public ProductBloomFilter(StringRedisTemplate redisTemplate, ProductMapper productMapper) {\n        this.redisTemplate = redisTemplate;\n        this.productMapper = productMapper;\n    }\n\n    /**\n     * 启动时把库里已有的商品 ID 灌进去。\n     * 不做这一步，重启后（或 Redis 过期后）过滤器是空的，\n     * 会**把所有请求都判为「不存在」** —— 比没有过滤器还糟。\n     */\n    @Override\n    @Transactional(readOnly = true)\n    public void run(ApplicationArguments args) {\n        try {\n            List<Product> products = productMapper.selectList(null);\n            if (products.isEmpty()) {\n                return;\n            }\n            for (Product product : products) {\n                add(product.getId());\n            }\n            log.info(\"布隆过滤器已预热 {} 个商品 ID\", products.size());\n        } catch (Exception e) {\n            // 预热失败不该拦住应用启动；之后新商品仍会被增量加入\n            log.warn(\"布隆过滤器预热失败，将退化为不放行过滤: {}\", e.getMessage());\n        }\n    }\n\n    public void add(Long productId) {\n        if (productId == null) {\n            return;\n        }\n        addTo(KEY, productId);\n    }\n\n    /** @return false 表示**一定不存在**（可以放心拒掉）；true 只是「可能存在」，仍需查库 */\n    public boolean mightContain(Long productId) {\n        if (productId == null) {\n            return false;\n        }\n        List<String> values = new ArrayList<>(HASH_COUNT);\n        for (int i = 0; i < HASH_COUNT; i++) {\n            values.add(String.valueOf(index(productId, i)));\n        }\n        List<?> result = redisTemplate.execute(MIGHT_CONTAIN_SCRIPT, List.of(KEY), values.toArray());\n        return result != null && !result.isEmpty() && \"1\".equals(String.valueOf(result.get(0)));\n    }\n\n    /**\n     * 全量重建 —— 用于「有商品没走 create 接口入库」的场景（数据迁移、手工 SQL、导入脚本）。\n     *\n     * **建到临时 key 再 RENAME 切换，绝不能「先删再建」**：\n     * 先删的话，重建完成前过滤器是空的，那一小段时间里**所有商品都会被判为「不存在」**，\n     * 比不重建还糟。"
      }

        "code": "    private static final String LOCK_KEY = RedisCacheHelper.key(\"product-cleanup:scan-lock\");\n\n    private final ProductCleanupService cleanupService;\n    private final ProductCleanupProperties properties;\n    private final StringRedisTemplate redisTemplate;\n\n    public ProductCleanupJob(ProductCleanupService cleanupService,\n                             ProductCleanupProperties properties,\n                             StringRedisTemplate redisTemplate) {\n        this.cleanupService = cleanupService;\n        this.properties = properties;\n        this.redisTemplate = redisTemplate;\n    }\n\n    @Scheduled(fixedDelayString = \"${itsmygo.product-cleanup.scan-interval-ms:86400000}\")\n    public void scan() {\n        String token = UUID.randomUUID().toString();\n        Boolean locked;\n        try {\n            locked = redisTemplate.opsForValue().setIfAbsent(LOCK_KEY, token,\n                    Duration.ofSeconds(properties.getScanLockTtlSeconds()));\n        } catch (RuntimeException e) {\n            log.warn(\"商品清理扫描抢锁异常，跳过本轮: {}\", e.getMessage());\n            return;\n        }\n        if (!Boolean.TRUE.equals(locked)) {\n            log.info(\"商品清理扫描已有实例在跑，跳过本轮\");\n            return;\n        }\n        try {\n            cleanupService.run(properties.isDryRun());\n        } catch (RuntimeException e) {\n            log.warn(\"商品清理扫描失败: {}\", e.getMessage());\n        } finally {\n            try {\n                String current = redisTemplate.opsForValue().get(LOCK_KEY);\n                if (token.equals(current)) {\n                    redisTemplate.delete(LOCK_KEY);\n                }\n            } catch (RuntimeException ignored) {\n                // 锁会自动过期\n            }\n        }\n    }\n}"

e.NOT_FOUND, \"优惠券不存在\");\n        }\n        if (!Integer.valueOf(ENABLED).equals(coupon.getStatus())) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"优惠券已停用\");\n        }\n        if (coupon.getMerchantId() != null\n                && !isActive(merchantMapper.selectById(coupon.getMerchantId()))) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"店铺已停用，无法领取该券\");\n        }\n\n        UserCoupon userCoupon = new UserCoupon();\n        userCoupon.setUserId(userId);\n        userCoupon.setCouponId(couponId);\n        userCoupon.setMerchantId(coupon.getMerchantId());\n        // 快照：模板以后改价/改期，不影响已领的券\n        userCoupon.setCouponName(coupon.getName());\n        userCoupon.setThresholdAmount(coupon.getThresholdAmount());\n        userCoupon.setDiscountAmount(coupon.getDiscountAmount());\n        userCoupon.setValidFrom(coupon.getValidFrom());\n        userCoupon.setValidTo(coupon.getValidTo());\n        userCoupon.setStatus(UserCoupon.UNUSED);\n\n        try {\n            userCouponMapper.insert(userCoupon);\n        } catch (DuplicateKeyException e) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"该优惠券已领取\");\n        }\n\n        // 最终以这条条件更新为准：领完/失效都会返回 0，事务回滚上面那条插入\n        if (couponMapper.claimOne(couponId) == 0) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"优惠券已领完或已失效\");\n        }\n    }\n\n    @Override"

        "code": "    public List<Address> list(Long userId) {\n        return addressMapper.selectList(Wrappers.<Address>lambdaQuery()\n                .eq(Address::getUserId, userId)\n                .orderByDesc(Address::getIsDefault)\n                .orderByDesc(Address::getId));\n    }\n\n    @Override\n    @Transactional\n    public Address create(Long userId, AddressRequest request) {\n        Address address = new Address();\n        apply(address, request);\n        address.setUserId(userId);\n        if (isDefault(address)) {\n            clearDefault(userId);\n        }\n        addressMapper.insert(address);\n        return address;\n    }\n\n    @Override\n    @Transactional\n    public Address update(Long userId, Long id, AddressRequest request) {\n        Address address = requireOwned(userId, id);\n        apply(address, request);\n        if (isDefault(address)) {\n            clearDefault(userId);\n        }\n        addressMapper.updateById(address);\n        return address;\n    }\n\n    @Override\n    public void delete(Long userId, Long id) {\n        requireOwned(userId, id);\n        addressMapper.deleteById(id);\n    }\n\n    @Override\n    @Transactional\n    public void setDefault(Long userId, Long id) {\n        requireOwned(userId, id);\n        clearDefault(userId);\n\n        Address update = new Address();\n        update.setId(id);\n        update.setIsDefault(1);\n        addressMapper.updateById(update);\n    }\n\n    private void apply(Address address, AddressRequest request) {\n        address.setReceiver(request.receiver());\n        address.setPhone(request.phone());\n        address.setProvince(request.province());\n        address.setCity(request.city());\n        address.setDistrict(request.district());\n        address.setDetail(request.detail());\n        // 浏览器 PUT 必填 isDefault；内部工具（agent address_edit）只改收货信息、传 null，\n        // 这里保留原默认标记，避免顺带把用户的默认地址清掉。\n        if (request.isDefault() != null) {\n            address.setIsDefault(Boolean.TRUE.equals(request.isDefault()) ? 1 : 0);\n        }\n    }\n\n    private boolean isDefault(Address address) {\n        return Integer.valueOf(1).equals(address.getIsDefault());\n    }\n\n    /** 一个用户至多一个默认地址 */\n    private void clearDefault(Long userId) {\n        Address reset = new Address();\n        reset.setIsDefault(0);\n        addressMapper.update(reset, Wrappers.<Address>lambdaUpdate()\n                .eq(Address::getUserId, userId)\n                .eq(Address::getIsDefault, 1));\n    }\n\n    /**\n     * 越权校验的唯一出口：别人的地址一律按「不存在」处理，\n     * 不返回 403 —— 那等于告诉调用方「这条数据存在，只是不属于你」。\n     */\n    private Address requireOwned(Long userId, Long id) {\n        Address address = addressMapper.selectById(id);\n        if (address == null || !userId.equals(address.getUserId())) {\n            throw new BizException(ResultCode.NOT_FOUND, \"地址不存在\");\n        }\n        return address;\n    }"

        "code": "private CheckoutPlan buildCheckoutPlan(Long userId,\n                                       List<OrderLine> lines,\n                                       boolean fromCart,\n                                       List<CreateOrderRequest.CouponSelection> coupons) {\n    Map<Long, Product> products = productMapper.selectByIds(\n                    lines.stream().map(OrderLine::productId).distinct().toList())\n            .stream().collect(Collectors.toMap(Product::getId, Function.identity()));\n    Map<Long, ProductSku> skus = skuMapper.selectByIds(\n                    lines.stream().map(OrderLine::skuId).distinct().toList())\n            .stream().collect(Collectors.toMap(ProductSku::getId, Function.identity()));\n\n    // 先按商户分组，并校验商品/规格/店铺\n    Map<Long, List<OrderLine>> groups = new LinkedHashMap<>();\n    Map<Long, BigDecimal> groupTotals = new LinkedHashMap<>();\n    Set<Long> merchantIds = new HashSet<>();\n    for (OrderLine line : lines) {\n        Product product = products.get(line.productId());\n        if (product == null || !Integer.valueOf(ON_SALE).equals(product.getStatus())) {\n            throw new BizException(ResultCode.BAD_REQUEST,\n                    fromCart ? \"商品已下架，请先移出购物车\" : \"商品已下架\");\n        }\n        ProductSku sku = skus.get(line.skuId());\n        if (sku == null || !line.productId().equals(sku.getProductId())) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"商品规格不存在，请重新选择\");\n        }\n        if (!Integer.valueOf(ON_SALE).equals(sku.getStatus())) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"该规格已停售\");\n        }\n        merchantIds.add(product.getMerchantId());\n        groups.computeIfAbsent(product.getMerchantId(), k -> new ArrayList<>()).add(line);\n        groupTotals.merge(product.getMerchantId(),\n                sku.getPrice().multiply(BigDecimal.valueOf(line.quantity())), BigDecimal::add);\n    }\n\n    Map<Long, Merchant> merchants = merchantMapper.selectByIds(merchantIds.stream().toList())\n            .stream().collect(Collectors.toMap(Merchant::getId, Function.identity()));\n    for (Long merchantId : groups.keySet()) {\n        Merchant merchant = merchants.get(merchantId);\n        if (merchant == null || !Merchant.ACTIVE.equals(merchant.getStatus())) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"店铺已停用，请先移出购物车\");\n        }\n    }\n\n    // 券全部预校验完再动库存：平台券只能分配给一个子订单，店铺券只能用于本店\n    Map<Long, UserCoupon> groupCoupons = validateCoupons(userId, coupons, groups.keySet(), groupTotals);\n    Map<Long, BigDecimal> groupDiscounts = new LinkedHashMap<>();\n    for (Map.Entry<Long, UserCoupon> entry : groupCoupons.entrySet()) {\n        groupDiscounts.put(entry.getKey(),\n                entry.getValue().getDiscountAmount().min(groupTotals.get(entry.getKey())));\n    }\n    return new CheckoutPlan(groups, groupTotals, products, skus, merchants, groupCoupons, groupDiscounts);\n}"

        "code": "private CheckoutView doCreate(Long userId, CreateOrderRequest request) {\n    Address address = requireAddress(userId, request.addressId());\n\n    // 商品有两种来源，之后一视同仁：立即购买（直接给定）or 购物车勾选项\n    boolean fromCart = request.items() == null || request.items().isEmpty();\n    List<OrderLine> lines = fromCart ? selectedCartLines(userId) : buyNowLines(request.items());\n    if (lines.isEmpty()) {\n        throw new BizException(ResultCode.BAD_REQUEST, \"没有可结算的商品\");\n    }\n\n    CheckoutPlan plan = buildCheckoutPlan(userId, lines, fromCart, request.coupons());\n\n    // 已成功扣减的 **SKU** → 数量；出错或事务回滚时按它回补 Redis\n    Map<Long, Integer> reserved = new LinkedHashMap<>();\n    AtomicBoolean released = new AtomicBoolean(false);\n    Runnable releaseReserved = () -> {\n        if (released.compareAndSet(false, true)) {\n            reserved.forEach(stockService::release);\n        }\n    };\n    // 业务 catch 只能覆盖方法内抛出的异常；提交阶段失败要靠事务回调\n    if (TransactionSynchronizationManager.isSynchronizationActive()) {\n        TransactionSynchronizationManager.registerSynchronization(new TransactionSynchronization() {\n            @Override\n            public void afterCompletion(int status) {\n                if (status != TransactionSynchronization.STATUS_COMMITTED) {\n                    releaseReserved.run();\n                }\n            }\n        });\n    }\n\n    try {\n        reserveStock(plan, reserved);\n\n        // 购物车结算的待清行先快照：异步补账时按 ID 删除，避免误删补账期间新加入的商品\n        List<Long> cartItemIds = fromCart ? selectedCartItemIds(userId) : List.of();\n        List<CreatedOrder> created = persistOrders(userId, address, plan);\n        return finishCheckout(created, cartItemIds);\n    } catch (RuntimeException e) {\n        releaseReserved.run();\n        throw e;\n    }\n}"

        "code": "private CheckoutPlan buildCheckoutPlan(Long userId,\n                                       List<OrderLine> lines,\n                                       boolean fromCart,\n                                       List<CreateOrderRequest.CouponSelection> coupons) {\n    Map<Long, Product> products = productMapper.selectByIds(\n                    lines.stream().map(OrderLine::productId).distinct().toList())\n            .stream().collect(Collectors.toMap(Product::getId, Function.identity()));\n    Map<Long, ProductSku> skus = skuMapper.selectByIds(\n                    lines.stream().map(OrderLine::skuId).distinct().toList())\n            .stream().collect(Collectors.toMap(ProductSku::getId, Function.identity()));\n\n    // 先按商户分组，并校验商品/规格/店铺\n    Map<Long, List<OrderLine>> groups = new LinkedHashMap<>();\n    Map<Long, BigDecimal> groupTotals = new LinkedHashMap<>();\n    Set<Long> merchantIds = new HashSet<>();\n    for (OrderLine line : lines) {\n        Product product = products.get(line.productId());\n        if (product == null || !Integer.valueOf(ON_SALE).equals(product.getStatus())) {\n            throw new BizException(ResultCode.BAD_REQUEST,\n                    fromCart ? \"商品已下架，请先移出购物车\" : \"商品已下架\");\n        }\n        ProductSku sku = skus.get(line.skuId());\n        if (sku == null || !line.productId().equals(sku.getProductId())) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"商品规格不存在，请重新选择\");\n        }\n        if (!Integer.valueOf(ON_SALE).equals(sku.getStatus())) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"该规格已停售\");\n        }\n        merchantIds.add(product.getMerchantId());\n        groups.computeIfAbsent(product.getMerchantId(), k -> new ArrayList<>()).add(line);\n        groupTotals.merge(product.getMerchantId(),\n                sku.getPrice().multiply(BigDecimal.valueOf(line.quantity())), BigDecimal::add);\n    }\n\n    Map<Long, Merchant> merchants = merchantMapper.selectByIds(merchantIds.stream().toList())\n            .stream().collect(Collectors.toMap(Merchant::getId, Function.identity()));\n    for (Long merchantId : groups.keySet()) {\n        Merchant merchant = merchants.get(merchantId);\n        if (merchant == null || !Merchant.ACTIVE.equals(merchant.getStatus())) {\n            throw new BizException(ResultCode.BAD_REQUEST, \"店铺已停用，请先移出购物车\");\n        }\n    }\n\n    // 券全部预校验完再动库存：平台券只能分配给一个子订单，店铺券只能用于本店\n    Map<Long, UserCoupon> groupCoupons = validateCoupons(userId, coupons, groups.keySet(), groupTotals);\n    Map<Long, BigDecimal> groupDiscounts = new LinkedHashMap<>();\n    for (Map.Entry<Long, UserCoupon> entry : groupCoupons.entrySet()) {\n        groupDiscounts.put(entry.getKey(),\n                entry.getValue().getDiscountAmount().min(groupTotals.get(entry.getKey())));\n    }\n    return new CheckoutPlan(groups, groupTotals, products, skus, merchants, groupCoupons, groupDiscounts);\n}"

        "code": "private List<CreatedOrder> persistOrders(Long userId, Address address, CheckoutPlan plan) {\n    List<CreatedOrder> created = new ArrayList<>(plan.groups().size());\n    for (Map.Entry<Long, List<OrderLine>> entry : plan.groups().entrySet()) {\n        Long merchantId = entry.getKey();\n        BigDecimal goodsTotal = plan.groupTotals().get(merchantId);\n        UserCoupon coupon = plan.groupCoupons().get(merchantId);\n        BigDecimal discount = plan.groupDiscounts().getOrDefault(merchantId, BigDecimal.ZERO);\n\n        Order order = new Order();\n        order.setOrderNo(generateOrderNo());\n        order.setUserId(userId);\n        order.setMerchantId(merchantId);\n        order.setMerchantName(plan.merchants().get(merchantId).getName());\n        order.setOriginalAmount(goodsTotal);\n        order.setDiscountAmount(discount);\n        order.setTotalAmount(goodsTotal.subtract(discount));\n        order.setUserCouponId(coupon == null ? null : coupon.getId());\n        order.setCouponName(coupon == null ? \"\" : coupon.getCouponName());\n        // M31：先落占位订单，券占用 / DB 扣库存 / 清购物车在补账阶段完成\n        order.setStatus(OrderStatus.CREATING.name());\n        order.setCreateError(\"\");\n        order.setCreateAttempts(0);\n        // 收货信息也快照：用户以后改地址或删地址，这张订单不受影响\n        order.setReceiver(address.getReceiver());\n        order.setPhone(address.getPhone());\n        order.setAddress(address.getProvince() + address.getCity()\n                + address.getDistrict() + address.getDetail());\n        order.setTrackingNo(\"\");\n        orderMapper.insert(order);\n\n        List<OrderItem> items = new ArrayList<>(entry.getValue().size());\n        for (OrderLine line : entry.getValue()) {\n            Product product = plan.products().get(line.productId());\n            ProductSku sku = plan.skus().get(line.skuId());\n            OrderItem item = new OrderItem();\n            item.setOrderId(order.getId());\n            item.setProductId(product.getId());\n            item.setSkuId(sku.getId());\n            // 以下都是快照：商品改价改名、规格改名甚至被删，都不影响这张订单\n            item.setProductName(product.getName());\n            item.setProductImage(StringUtils.hasText(sku.getImage())\n                    ? sku.getImage() : product.getMainImage());\n            item.setSpecText(sku.getSpecText());\n            item.setUnitPrice(sku.getPrice());\n            item.setQuantity(line.quantity());\n            item.setSubtotal(sku.getPrice().multiply(BigDecimal.valueOf(line.quantity())));\n            orderItemMapper.insert(item);\n            items.add(item);\n        }\n        created.add(new CreatedOrder(order, items));\n    }\n    return created;\n}"

        "code": "private CheckoutView finishCheckout(List<CreatedOrder> created, List<Long> cartItemIds) {\n    List<OrderView> views = created.stream()\n            .map(c -> new OrderView(c.order(), OrderStatus.CREATING.label(),\n                    c.items(), c.items().size()))\n            .toList();\n    List<Long> orderIds = created.stream().map(c -> c.order().getId()).toList();\n    if (orderCreateProperties.async()) {\n        // 事务提交后发 MQ；补账失败由消费端收尾（CREATE_FAILED）\n        orderCreatedMqPublisher.publishAfterCommit(orderIds, cartItemIds);\n    } else {\n        // 同步降级：与旧链路等价（测试 / 无 MQ 环境）\n        orderSettlementService.settle(orderIds, cartItemIds);\n        // 结算服务改的是它自己查出来的实体；占位实体的状态要同步，否则响应里还是「创建中」\n        for (CreatedOrder c : created) {\n            c.order().setStatus(OrderStatus.PENDING_PAYMENT.name());\n        }\n        views = created.stream()\n                .map(c -> new OrderView(c.order(), OrderStatus.PENDING_PAYMENT.label(),\n                        c.items(), c.items().size()))\n                .toList();\n    }\n    return CheckoutView.of(views);\n}"

        "code": "package com.tsuk1.itsmygo.entity;\n\n/**\n * 订单状态机。**合法流转只认这一个地方**，不要散落到各个 Service 里判断。\n *\n * <pre>\n * 创建中(CREATING) ──补账成功──> 待支付 ──支付──> 待发货 ──发货──> 待收货 ──确认收货──> 已完成\n *      └──补账失败/超时──> 创建失败（终态，可重新下单）\n *\n * 待支付 ──取消──> 已取消（终态）\n * 待发货 / 待收货 / 已完成 ──申请退款──> 退款中 ──同意──> 已退款（终态）\n *                                      └──驳回──> 回到申请前的状态\n * </pre>\n *\n * 待收货之后不能再取消（货已经出去了），只能走退款。\n * 已退款 / 已取消 / 已完成 是终态（已完成仍可申请退款 —— 相当于七天无理由）。\n * 创建中/创建失败是 M31 下单异步补账引入的状态：创建中不可支付、不可取消。\n */\npublic enum OrderStatus {\n\n    /** 占位订单已落库，等待异步补账（扣 DB 库存 / 占券 / 清购物车） */\n    CREATING(\"创建中\"),\n    /** 补账失败或超时；终态，用户需要重新下单 */\n    CREATE_FAILED(\"创建失败\"),\n    PENDING_PAYMENT(\"待支付\"),\n    /** 已支付，等待商家发货 */\n    PAID(\"待发货\"),\n    /** 已发货，等待买家确认收货 */\n    SHIPPED(\"待收货\"),\n    COMPLETED(\"已完成\"),\n    CANCELLED(\"已取消\"),\n    REFUNDING(\"退款中\"),\n    REFUNDED(\"已退款\");\n\n    private final String label;\n\n    OrderStatus(String label) {\n        this.label = label;\n    }\n\n    public String label() {\n        return label;\n    }\n\n    public boolean canTransitionTo(OrderStatus target) {\n        return switch (this) {\n            case CREATING -> target == PENDING_PAYMENT || target == CREATE_FAILED;\n            case PENDING_PAYMENT -> target == PAID || target == CANCELLED;\n            case PAID -> target == SHIPPED || target == CANCELLED || target == REFUNDING;\n            case SHIPPED -> target == COMPLETED || target == REFUNDING;\n            case COMPLETED -> target == REFUNDING;\n            // 退款被驳回不是「流转到某个固定状态」，而是回到申请前那个状态，\n            // 所以这里放行到 PAID / SHIPPED / COMPLETED，具体由 Service 校验一致性\n            case REFUNDING -> target == REFUNDED || target == PAID\n                    || target == SHIPPED || target == COMPLETED;\n            case REFUNDED, CANCELLED, CREATE_FAILED -> false;\n        };\n    }\n\n    /** 取消要回滚库存；只有「还没付款」的订单可以取消（已支付统一走退款/售后） */"

        "code": "private static final RedisScript<Long> RESERVE_SCRIPT = new DefaultRedisScript<>(\"\"\"\n        local stock = redis.call('GET', KEYS[1])\n        if not stock then\n            return -1\n        end\n        if tonumber(stock) < tonumber(ARGV[1]) then\n            return -1\n        end\n        return redis.call('DECRBY', KEYS[1], ARGV[1])\n        \"\"\", Long.class);\n\nprivate final StringRedisTemplate redisTemplate;\nprivate final ProductSkuMapper skuMapper;\n\npublic StockServiceImpl(StringRedisTemplate redisTemplate, ProductSkuMapper skuMapper) {\n    this.redisTemplate = redisTemplate;\n    this.skuMapper = skuMapper;\n}\n\n@Override\npublic boolean tryReserve(Long skuId, int quantity) {\n    String key = key(skuId);\n    loadIfAbsent(skuId, key);\n\n    Long remain = redisTemplate.execute(RESERVE_SCRIPT, List.of(key), String.valueOf(quantity));\n    return remain != null && remain >= 0;\n}"

        "code": "    public OrderCreatedConsumer(OrderSettlementService settlementService,\n                                ObjectMapper objectMapper) {\n        this.settlementService = settlementService;\n        this.objectMapper = objectMapper;\n    }\n\n    @RabbitListener(queues = OrderCreatedRabbitTopology.QUEUE)\n    public void onMessage(Message message) {\n        String traceId = (String) message.getMessageProperties().getHeaders()\n                .get(RequestIdFilter.TRACE_HEADER);\n        if (traceId == null || traceId.isBlank()) {\n            traceId = \"mq-\" + UUID.randomUUID().toString().replace(\"-\", \"\");\n        }\n        MDC.put(RequestIdFilter.TRACE_ID, traceId);\n        try {\n            handlePayload(new String(message.getBody(), StandardCharsets.UTF_8));\n        } finally {\n            MDC.remove(RequestIdFilter.TRACE_ID);\n        }\n    }\n\n    void handlePayload(String payload) {\n        OrderCreatedEvent event;\n        try {\n            event = objectMapper.readValue(payload, OrderCreatedEvent.class);\n        } catch (RuntimeException e) {\n            log.warn(\"忽略无法解析的订单创建事件: {}\", payload);\n            return;\n        }\n        List<Long> orderIds = event.orderIds() == null ? List.of() : event.orderIds();\n        if (orderIds.isEmpty()) {\n            return;\n        }\n        try {\n            settlementService.settle(orderIds, event.cartItemIds());\n        } catch (RuntimeException e) {\n            log.warn(\"订单异步补账失败，转创建失败: orderIds={} err={}\", orderIds, e.getMessage());\n            try {\n                settlementService.failCreation(orderIds, \"补账失败：\" + e.getMessage());\n            } catch (RuntimeException compensationError) {\n                log.error(\"订单创建失败收尾也失败，交给扫描兜底: orderIds={}\", orderIds, compensationError);\n            }\n            // 已经做过失败收尾就 ack；不要无限重投\n            throw new AmqpRejectAndDontRequeueException(\n                    \"订单补账失败: orderIds=\" + orderIds);\n        }\n    }         "label": "库存加载：DB 回源 + 互斥锁",
        "file": "src/main/java/com/tsuk1/itsmygo/service/impl/StockServiceImpl.java:152-198",
        "code": "    private void loadIfAbsent(Long skuId, String key) {\n        if (isLoaded(key)) {\n            return;\n        }\n\n        String lockKey = key + \":loading\";\n        // SETNX + TTL 一条命令完成，别拆成 SETNX 再 EXPIRE（两步之间崩掉就是死锁）\n        Boolean gotLock = redisTemplate.opsForValue()\n                .setIfAbsent(lockKey, \"1\", LOAD_LOCK_TTL);\n\n        if (Boolean.TRUE.equals(gotLock)) {\n            try {\n                // 双重检查：抢锁这段时间里，上一个持锁者可能已经把数据写好了\n                if (isLoaded(key)) {\n                    return;\n                }\n                ProductSku sku = skuMapper.selectById(skuId);\n                if (sku != null) {\n                    redisTemplate.opsForValue().set(key, String.valueOf(sku.getStock()), stockTtl());\n                }\n            } finally {\n                // 放锁一定要在 finally 里，否则中途抛异常锁会一直留到 TTL 到期\n                redisTemplate.delete(lockKey);\n            }\n            return;\n        }\n\n        // 没抢到锁 —— 说明别人正在加载，**绝不能也去查库**，自旋等它写完即可\n        awaitLoaded(key);\n    }\n\n    private void awaitLoaded(String key) {\n        for (int round = 0; round < MAX_WAIT_ROUNDS; round++) {\n            try {\n                Thread.sleep(WAIT_INTERVAL_MILLIS);\n            } catch (InterruptedException e) {\n                Thread.currentThread().interrupt();\n                return;\n            }\n            if (isLoaded(key)) {\n                return;\n            }\n        }\n        // 等不到就放弃：后续 Lua 会因键不存在返回 -1，上层按「库存不足」处理\n        log.warn(\"等待库存缓存加载超时: {}\", key);\n    }"

        "code": "    public void createForOrder(Order order) {\n        if (order == null || order.getId() == null || find(order.getId()) != null) {\n            return;\n        }\n        int seed = (int) Math.floorMod(order.getId(), (long) CARRIERS.size());\n        Courier courier = COURIERS.get(seed);\n\n        // 商家配了发货坐标就从商家发货；否则回退虚拟转运中心\n        Merchant merchant = order.getMerchantId() == null\n                ? null : merchantMapper.selectById(order.getMerchantId());\n        boolean merchantLocated = merchant != null\n                && merchant.getShipLng() != null && merchant.getShipLat() != null;\n        String originName;\n        double originLng;\n        double originLat;\n        if (merchantLocated) {\n            originName = merchant.getName() + \"发货仓\";\n            originLng = merchant.getShipLng().doubleValue();\n            originLat = merchant.getShipLat().doubleValue();\n        } else {\n            Origin origin = ORIGINS.get(seed);\n            originName = origin.name();\n            originLng = origin.lng();\n            originLat = origin.lat();\n        }\n\n        LocalDateTime shippedAt = order.getShippedAt() == null\n                ? LocalDateTime.now() : order.getShippedAt();\n        Shipment shipment = new Shipment();\n        shipment.setOrderId(order.getId());\n        shipment.setTrackingNo(StringUtils.hasText(order.getTrackingNo())\n                ? order.getTrackingNo() : \"MYG\" + order.getOrderNo());\n        shipment.setCarrier(CARRIERS.get(seed));\n        shipment.setCourierName(courier.name());\n        shipment.setCourierPhone(courier.phone());\n        shipment.setOriginName(originName);\n        shipment.setOriginLng(originLng);\n        shipment.setOriginLat(originLat);\n        shipment.setStatus(ShipmentStatus.PICKED_UP.name());\n        shipment.setShippedAt(shippedAt);\n        shipment.setEta(shippedAt.plusMinutes(properties.deliveryMinutes()));\n        shipmentMapper.insert(shipment);\n    }\n\n    @Override\n    public LogisticsView viewForOrder(Order order) {\n        if (order == null || order.getId() == null) {\n            return null;\n        }\n        Shipment shipment = find(order.getId());\n        if (shipment == null) {\n            return null;\n        }\n\n        LocalDateTime now = LocalDateTime.now();\n        LocalDateTime shippedAt = shipment.getShippedAt();\n        LocalDateTime eta = shipment.getEta();\n        long totalSeconds = Math.max(1, Duration.between(shippedAt, eta).getSeconds());\n        LocalDateTime inTransitAt = shippedAt.plusSeconds(Math.max(1, totalSeconds / 4));\n        LocalDateTime outForDeliveryAt = eta.minusSeconds(Math.max(1, totalSeconds / 5));\n        if (outForDeliveryAt.isBefore(inTransitAt)) {\n            outForDeliveryAt = inTransitAt;\n        }\n\n        boolean cancelled = ShipmentStatus.CANCELLED.name().equals(shipment.getStatus());\n        ShipmentStatus status;\n        LocalDateTime deliveredAt = shipment.getDeliveredAt();\n        if (cancelled) {\n            status = ShipmentStatus.CANCELLED;\n        } else if (!now.isBefore(eta)) {\n            status = ShipmentStatus.DELIVERED;\n            deliveredAt = eta;\n        } else if (!now.isBefore(outForDeliveryAt)) {\n            status = ShipmentStatus.OUT_FOR_DELIVERY;\n        } else if (!now.isBefore(inTransitAt)) {\n            status = ShipmentStatus.IN_TRANSIT;\n        } else {\n            status = ShipmentStatus.PICKED_UP;\n        }\n\n        if (!status.name().equals(shipment.getStatus())\n                || (deliveredAt != null && !deliveredAt.equals(shipment.getDeliveredAt()))) {\n            shipment.setStatus(status.name());\n            shipment.setDeliveredAt(deliveredAt);\n            shipmentMapper.updateById(shipment);\n        }\n\n        long elapsed = Math.max(0, Duration.between(shippedAt, now).getSeconds());\n        int progress = (int) Math.min(100, elapsed * 100 / totalSeconds);"

        "code": "    private static final String LOCK_KEY = RedisCacheHelper.key(\"order-timeout:scan-lock\");\n    private static final DefaultRedisScript<Long> RELEASE_SCRIPT = new DefaultRedisScript<>(\n            \"if redis.call('get', KEYS[1]) == ARGV[1] \"\n                    + \"then return redis.call('del', KEYS[1]) else return 0 end\",\n            Long.class);\n\n    private final OrderService orderService;\n    private final StringRedisTemplate redisTemplate;\n    private final OrderTimeoutProperties properties;\n\n    public OrderTimeoutScanJob(OrderService orderService,\n                               StringRedisTemplate redisTemplate,\n                               OrderTimeoutProperties properties) {\n        this.orderService = orderService;\n        this.redisTemplate = redisTemplate;\n        this.properties = properties;\n    }\n\n    @Scheduled(fixedDelayString = \"${itsmygo.order-timeout.scan-interval-ms:300000}\")\n    public void scan() {\n        MDC.put(RequestIdFilter.TRACE_ID,\n                \"scan-\" + UUID.randomUUID().toString().replace(\"-\", \"\"));\n        try {\n            doScan();\n        } finally {\n            MDC.remove(RequestIdFilter.TRACE_ID);\n        }\n    }\n\n    private void doScan() {\n        String token = UUID.randomUUID().toString();\n        Boolean locked;\n        try {\n            locked = redisTemplate.opsForValue().setIfAbsent(\n                    LOCK_KEY, token, Duration.ofSeconds(properties.scanLockTtlSeconds()));\n        } catch (RuntimeException e) {\n            log.warn(\"超时关单扫描抢锁失败，跳过本轮: {}\", e.getMessage());\n            return;\n        }\n        if (!Boolean.TRUE.equals(locked)) {\n            return;\n        }\n\n        try {\n            int cancelled = orderService.cancelExpired(properties.minutes());\n            if (cancelled > 0) {\n                log.info(\"超时关单扫描取消 {} 笔订单（阈值 {} 分钟）\",\n                        cancelled, properties.minutes());\n            }\n        } catch (RuntimeException e) {\n            log.warn(\"超时关单扫描失败: {}\", e.getMessage());\n        } finally {\n            release(token);\n        }\n    }\n\n    private void release(String token) {\n        try {\n            redisTemplate.execute(RELEASE_SCRIPT, List.of(LOCK_KEY), token);\n        } catch (RuntimeException e) {\n            log.warn(\"释放超时关单扫描锁失败（TTL 会自动过期）: {}\", e.getMessage());\n        }\n    }"

Conversation.SIDE_CUSTOMER, registry.isMerchantOnline(conversation.getMerchantId()),\n                    merchant, customer);\n            registry.sendToUser(customer.getId(), ChatEvent.MESSAGE,\n                    new ChatEvent.Message(Conversation.SIDE_CUSTOMER, view, customerView,\n                            conversationMapper.sumCustomerUnread(customer.getId())));\n        }\n        List<Long> recipients = merchantRecipients(merchant);\n        if (merchant != null && !recipients.isEmpty()) {\n            ConversationView merchantView = toConversationView(conversation,\n                    Conversation.SIDE_MERCHANT, false, merchant, customer);\n            long unread = conversationMapper.sumMerchantUnread(merchant.getId());\n            for (Long recipient : recipients) {\n                registry.sendToUser(recipient, ChatEvent.MESSAGE,\n                        new ChatEvent.Message(Conversation.SIDE_MERCHANT, view, merchantView, unread));\n            }\n        }\n    }\n\n    // ── 查询与组装 ──"

ed\n    }\n  }\n\n  return {\n    claimableCoupons,\n    cartCount,\n    refreshCoupons,\n    refreshCart,\n    syncCoupons,\n    syncCart,\n    resetAuth,\n    refreshAll,\n    startPolling,\n    stopPolling,\n  }\n})"

        "code": "    public ProductCleanupReport run(boolean dryRun) {\n        LocalDateTime now = LocalDateTime.now();\n        int batch = Math.max(1, Math.min(properties.getBatchLimit(), 500));\n\n        List<Product> archiveCandidates = productMapper.selectList(Wrappers.<Product>lambdaQuery()\n                .eq(Product::getStatus, OFF_SHELF)\n                .isNull(Product::getArchivedAt)\n                .le(Product::getUpdatedAt, now.minusDays(properties.getOffShelfDays()))\n                .orderByAsc(Product::getId)\n                .last(\"LIMIT \" + batch));\n\n        int archived = 0;\n        if (!dryRun) {\n            for (Product product : archiveCandidates) {\n                int rows = productMapper.update(null, Wrappers.<Product>lambdaUpdate()\n                        .eq(Product::getId, product.getId())\n                        .eq(Product::getStatus, OFF_SHELF)\n                        .isNull(Product::getArchivedAt)\n                        .set(Product::getArchivedAt, now));\n                if (rows > 0) {\n                    archived++;\n                    // 归档后清购物车里的失效行（不进订单，无历史价值）\n                    cartItemMapper.delete(Wrappers.<CartItem>lambdaQuery()\n                            .eq(CartItem::getProductId, product.getId()));\n                    cacheHelper.evict(RedisCacheHelper.key(CACHE_KEY_PREFIX + product.getId()));\n                }\n            }\n        }\n\n        List<Product> purgeCandidates = productMapper.selectList(Wrappers.<Product>lambdaQuery()\n                .eq(Product::getStatus, OFF_SHELF)\n                .isNotNull(Product::getArchivedAt)\n                .le(Product::getArchivedAt, now.minusDays(properties.getArchiveGraceDays()))\n                .orderByAsc(Product::getId)\n                .last(\"LIMIT \" + batch));\n\n        int purgeable = 0;\n        int purged = 0;\n        int skipped = 0;\n        for (Product product : purgeCandidates) {\n            if (referenceChecker.hasReferences(product.getId())) {\n                skipped++;\n                continue;\n            }\n            purgeable++;\n            if (!dryRun) {\n                purge(product.getId());\n                purged++;\n            }\n        }\n\n        ProductCleanupReport report = new ProductCleanupReport(\n                dryRun, archiveCandidates.size(), dryRun ? 0 : archived,\n                purgeable, dryRun ? 0 : purged, skipped);\n        log.info(\"商品清理完成：dryRun={} 待归档={} 已归档={} 可清理={} 已清理={} 有引用跳过={}\",\n                dryRun, report.archiveCandidates(), report.archived(),\n                report.purgeCandidates(), report.purged(), report.skippedReferenced());\n        if (report.archiveCandidates() > 0 || report.purgeCandidates() > 0) {\n            notifyAdmins(report);\n        }\n        return report;\n    }\n\n    private void purge(Long productId) {\n        List<ProductSpec> specs = productSpecMapper.selectList(Wrappers.<ProductSpec>lambdaQuery()\n                .eq(ProductSpec::getProductId, productId));\n        if (!specs.isEmpty()) {\n            List<Long> specIds = specs.stream().map(ProductSpec::getId).toList();\n            productSpecValueMapper.delete(Wrappers.<ProductSpecValue>lambdaQuery()\n                    .in(ProductSpecValue::getSpecId, specIds));\n        }\n        productSpecMapper.delete(Wrappers.<ProductSpec>lambdaQuery()\n                .eq(ProductSpec::getProductId, productId));\n        productSkuMapper.delete(Wrappers.<ProductSku>lambdaQuery()\n                .eq(ProductSku::getProductId, productId));\n        priceHistoryMapper.delete(Wrappers.<ProductPriceHistory>lambdaQuery()\n                .eq(ProductPriceHistory::getProductId, productId));\n        productMapper.deleteById(productId);\n        cacheHelper.evict(RedisCacheHelper.key(CACHE_KEY_PREFIX + productId));\n        log.info(\"已物理清理无引用归档商品: productId={}\", productId);\n    }"

        "label": "stream()：gRPC -> SSE",
        "file": "src/main/java/com/tsuk1/itsmygo/service/impl/AgentChatServiceImpl.java:275-347",
        "code": "private void stream(CurrentUser user, String sessionId, String message, FormResult formResult,\n                    String toolTicket, boolean enableWebSearch, boolean streamEnabled,\n                    AgentSseSink sink, Context.CancellableContext context,\n                    AtomicReference<String> runIdRef,\n                    AtomicBoolean finalSeen, AtomicBoolean errorSeen, Runnable cleanup) {\n    try {\n        FormResult forwardedForm = formResult;\n        if (forwardedForm != null) {\n            // 先校验后消费：非法提交不能白白烧掉一张一次性表单\n            forwardedForm = normalizeRefundReason(forwardedForm);\n            if (forwardedForm == null) {\n                errorSeen.set(true);\n                sink.send(\"error\", AgentEventMapper.error(\"FORM_INVALID\",\n                        \"退款原因不在可选范围内，请重新选择后提交\", false));\n                sink.send(\"done\", AgentEventMapper.done(\"error\"));\n                return;\n            }\n            if (!formGuard.tryConsume(user.id(), forwardedForm.getFormId())) {\n                // SETNX 失败：不调 agent，直接告诉前端这张表单已经提交过\n                errorSeen.set(true);\n                sink.send(\"error\", AgentEventMapper.error(\"FORM_ALREADY_SUBMITTED\",\n                        \"这张表单已经提交过了，请重新发起一次\", false));\n                sink.send(\"done\", AgentEventMapper.done(\"error\"));\n                return;\n            }\n        }\n        FormResult effectiveForm = forwardedForm;\n        Iterator<Event> events = context.call(() -> gateway.converse(\n                user.id(), sessionId, message, effectiveForm,\n                Duration.ofSeconds(properties.deadlineSeconds()), toolTicket,\n                enableWebSearch, streamEnabled));\n\n        while (!sink.isClosed() && events.hasNext()) {\n            Event event = events.next();\n            Event.KindCase kind = event.getKindCase();\n            if (kind == Event.KindCase.START) {\n                runIdRef.set(event.getStart().getRunId());\n            } else if (kind == Event.KindCase.FINAL) {\n                finalSeen.set(true);\n                // 退款原因选项由 Java 用售后原因字典补全（agent 只下发空选项）\n                event = fillRefundReasonOptions(event);\n            } else if (kind == Event.KindCase.ERROR) {\n                errorSeen.set(true);\n                log.warn(\"买小购返回错误事件: {}\", event.getError().getMessage());\n            }\n            AgentEventMapper.Mapped mapped = AgentEventMapper.map(event);\n            if (mapped != null) {\n                sink.send(mapped.event(), mapped.data());\n            }\n        }\n\n        if (!sink.isClosed()) {\n            String reason = finalSeen.get() ? \"final\" : errorSeen.get() ? \"error\" : \"stopped\";\n            sink.send(\"done\", AgentEventMapper.done(reason));\n        }\n    } catch (StatusRuntimeException e) {\n        if (!sink.isClosed()) {\n            log.warn(\"买小购 gRPC 流失败: {} {}\", e.getStatus().getCode(),\n                    e.getStatus().getDescription());\n            sink.send(\"error\", grpcError(e));\n            sink.send(\"done\", AgentEventMapper.done(\"error\"));\n        }\n    } catch (Exception e) {\n        if (!sink.isClosed()) {\n            log.error(\"买小购流处理异常\", e);\n            sink.send(\"error\", AgentEventMapper.error(\n                    \"AGENT_ERROR\", \"客服处理失败，请稍后重试\", true));\n            sink.send(\"done\", AgentEventMapper.done(\"error\"));\n        }\n    } finally {\n        cleanup.run();\n    }\n}"

        "code": "public AgentActionView prepareOrder(long userId, String sessionId,\n                                    AgentOrderDraftRequest request) {\n    support.requireEnabled();\n    AgentOrderDraftBuilder.OrderDraft draft = orderDraftBuilder.build(userId, request);\n    // 幂等：同一会话里对同一份订单内容重复点「让买小购下单」时，返回已有草稿卡片，\n    // 不再重复生成（否则用户会看到多张一模一样的「订单待确认」）。\n    String payloadJson = support.json(draft.payload());\n    List<AgentAction> pendingOrders = actionMapper.selectList(\n            Wrappers.<AgentAction>lambdaQuery()\n                    .eq(AgentAction::getUserId, userId)\n                    .eq(AgentAction::getSessionId, sessionId)\n                    .eq(AgentAction::getType, AgentActionType.CREATE_ORDER.name())\n                    .eq(AgentAction::getStatus, AgentActionStatus.PENDING_CONFIRM.name())\n                    .gt(AgentAction::getExpiresAt, LocalDateTime.now())\n                    .orderByDesc(AgentAction::getId));\n    for (AgentAction existing : pendingOrders) {\n        if (payloadJson.equals(existing.getPayloadJson())) {\n            log.info(\"重复的订单草稿，返回已有卡片：{}\", existing.getActionNo());\n            return support.toView(existing);\n        }\n    }\n    // 同一会话只保留最新一张待确认下单卡：agent 换规格/换商品重新 prepare 时，\n    // 旧卡若继续 PENDING，前端按 FIFO 会先展示旧卡，用户可能确认错误规格。\n    for (AgentAction existing : pendingOrders) {\n        int cancelled = actionMapper.casStatus(existing.getActionNo(), userId,\n                AgentActionStatus.PENDING_CONFIRM.name(), AgentActionStatus.CANCELLED.name());\n        if (cancelled > 0) {\n            log.info(\"新下单草稿替换旧草稿：{}\", existing.getActionNo());\n        }\n    }\n\n    AgentAction action = support.newAction(userId, sessionId, AgentActionType.CREATE_ORDER,\n            draft.payload(), draft.summary(), null);\n    String token = orderService.issueToken(userId);\n    redis.opsForValue().set(TOKEN_PREFIX + action.getActionNo(), token,\n            Duration.ofSeconds(properties.expirySeconds()));\n    actionMapper.insert(action);\n    return support.toView(action);\n}"

bView job = evalClient.job(id);\n        notifyEvalDone(job);\n        return Result.ok(job);\n    }\n\n    /** 评测跑到终态时给管理员发一条站内通知（幂等：同一 job + 状态只发一次）。 */\n    private void notifyEvalDone(AgentEvalJobView job) {\n        if (job == null) {\n            return;\n        }\n        String status = job.status();\n        if (!\"completed\".equals(status) && !\"failed\".equals(status) && !\"stopped\".equals(status)) {\n            return;\n        }\n        String label = switch (status) {\n            case \"completed\" -> \"已完成\";\n            case \"failed\" -> \"失败\";\n            default -> \"已停止\";\n        };\n        try {\n            notificationService.notifyAdmins(\"AGENT_EVAL_DONE\", \"智能体评测\" + label,\n                    \"评测任务 \" + job.id() + \" \" + label + \"，可到评测台查看结果。\",\n                    \"/admin/agent-eval?jobId=\" + job.id(), \"agent-eval-done:\" + job.id() + \":\" + status);\n        } catch (RuntimeException ignored) {\n            // 通知失败不影响评测状态查询\n        }\n    }\n\n    /** 协作式停止：当前用例跑完后退出，已产出的结果保留。 */\n    @PreAuthorize(\"hasAuthority('admin:agent-eval:run')\")\n    @PostMapping(\"/jobs/{id}/stop\")\n    @AdminAudit(action = \"AGENT_EVAL_STOP\", label = \"停止智能体评测\",\n            targetType = \"AGENT_EVAL\")\n    public Result<AgentEvalJobView> stop(@PathVariable String id) {\n        return Result.ok(evalClient.stop(id));\n    }\n\n    private static int clamp(int value, int min, int max) {\n        return Math.max(min, Math.min(value, max));\n    }\n}"

        "code": "    public SseEmitter converse(CurrentUser user, AgentConverseRequest request) {\n        requireConfigured();\n        // 客服设置：在请求线程读（无行时是默认值 0/1/0），随本轮 gRPC Converse 一起下发\n        AgentPreferenceView preference = preferenceService.get(user.id());\n        String message = request.message().trim();\n        String sessionId;\n        if (StringUtils.hasText(request.sessionId())) {\n            sessionId = request.sessionId().trim();\n            requireOwned(sessionId, user.id());\n            sessionMapper.touch(sessionId, user.id());\n        } else {\n            // Java 先生成并记录归属，再调 Converse；不能等 SessionStart 回来才写，\n            // 否则异步线程写库有竞态，客户端也可能拿到未登记的 id。\n            sessionId = UUID.randomUUID().toString().replace(\"-\", \"\");\n            sessionMapper.insertSession(user.id(), sessionId);\n        }\n\n        if (activeStreams.putIfAbsent(sessionId, Boolean.TRUE) != null) {\n            throw new BizException(ResultCode.TOO_MANY_REQUESTS, \"该会话正在回复中，请稍候\");\n        }\n\n        // 本轮工具票据：agent 的 order-service 工具回调 /internal/agent/** 时带回。\n        // 只放 metadata，不下发浏览器，也不进模型上下文。\n        String toolTicket = toolTicketService.issue(user.id(), sessionId);\n\n        SseEmitter emitter = new SseEmitter(properties.deadlineSeconds() * 1000L + 30_000);\n        AgentSseSink sink = new AgentSseSink(emitter, objectMapper, auxExecutor);\n        Context.CancellableContext context = Context.current().withCancellation();\n        AtomicReference<String> runIdRef = new AtomicReference<>();\n        AtomicBoolean finalSeen = new AtomicBoolean(false);\n        AtomicBoolean errorSeen = new AtomicBoolean(false);\n        AtomicBoolean released = new AtomicBoolean(false);\n\n        String fixedSessionId = sessionId;\n        Runnable cleanup = () -> {\n            context.cancel(null);\n            sink.close();\n            if (released.compareAndSet(false, true)) {\n                activeStreams.remove(fixedSessionId);\n            }\n            String runId = runIdRef.get();\n            if (runId != null && !finalSeen.get() && !errorSeen.get()) {\n                // gRPC context cancel 只断流；Python worker 阻塞在队列上，必须用 runId 停\n                auxExecutor.execute(() -> {\n                    try {\n                        gateway.stop(user.id(), fixedSessionId, runId);\n                    } catch (Exception e) {\n                        log.debug(\"客服 Stop 失败（忽略）: {}\", e.getMessage());\n                    }\n                });\n            }\n        };\n\n        emitter.onCompletion(cleanup);\n        emitter.onTimeout(cleanup);\n        emitter.onError(error -> cleanup.run());\n\n        sink.start();\n        try {\n            FormResult formResult = toFormResult(request.formResult());\n            agentExecutor.execute(() -> stream(user, fixedSessionId, message, formResult, toolTicket,\n                    preference.webSearchEnabled(), preference.streamEnabled(),\n                    sink, context, runIdRef, finalSeen, errorSeen, cleanup));\n        } catch (RejectedExecutionException e) {\n            cleanup.run();\n            throw new BizException(ResultCode.TOO_MANY_REQUESTS, \"客服繁忙，请稍后再试\");\n        }\n        return emitter;\n    }\n\n    /** 前端表单回传 → gRPC 消息；空/缺失一律视为普通文本对话（兼容老客户端）。 */"

        "code": "    public AdminAuditAspect(AdminAuditService auditService) {\n        this.auditService = auditService;\n    }\n\n    @Around(\"execution(public * com.tsuk1.itsmygo.controller.Admin*Controller.*(..))\")\n    public Object around(ProceedingJoinPoint joinPoint) throws Throwable {\n        ServletRequestAttributes attributes =\n                (ServletRequestAttributes) RequestContextHolder.getRequestAttributes();\n        if (attributes == null) {\n            return joinPoint.proceed();\n        }\n        HttpServletRequest request = attributes.getRequest();\n        String httpMethod = request.getMethod();\n        if (READ_METHODS.contains(httpMethod)) {\n            return joinPoint.proceed();\n        }\n\n        AdminAudit audit = resolveAudit(joinPoint);\n        String uri = request.getRequestURI();\n        String action = audit == null\n                ? httpMethod + \" \" + normalizeUri(uri)\n                : audit.action();\n        String summary = audit == null\n                ? joinPoint.getSignature().getName()\n                : audit.label();\n        String targetType = audit == null\n                ? fallbackTargetType(uri)\n                : audit.targetType();\n\n        long start = System.currentTimeMillis();\n        Object result = null;\n        Throwable failure = null;\n        try {\n            result = joinPoint.proceed();\n            if (result instanceof Result<?> response && response.getCode() != 200) {\n                failure = new IllegalStateException(response.getMessage());\n            }\n            return result;\n        } catch (Throwable t) {\n            failure = t;\n            throw t;\n        } finally {\n            record(joinPoint, request, action, summary, targetType, result, failure,\n                    System.currentTimeMillis() - start);\n        }\n    }\n\n    private void record(ProceedingJoinPoint joinPoint, HttpServletRequest request,\n                        String action, String summary, String targetType, Object result,\n                        Throwable failure, long elapsedMs) {\n        try {\n            AdminAuditLog audit = new AdminAuditLog();\n            CurrentUser actor = currentUser();\n            audit.setActorUserId(actor == null ? 0L : actor.id());\n            audit.setActorUsername(actor == null ? \"\" : actor.username());\n            audit.setAction(truncate(action, 64));\n            audit.setTargetType(truncate(targetType, 32));\n            audit.setTargetId(targetId(request));\n            audit.setSummary(truncate(summary, 255));\n            audit.setResult(failure == null ? \"SUCCESS\" : \"FAILED\");\n            audit.setErrorMessage(failure == null ? \"\" : truncate(message(failure), 512));\n            audit.setIp(truncate(request.getRemoteAddr(), 64));\n            audit.setUserAgent(truncate(request.getHeader(\"User-Agent\"), 512));\n            audit.setTraceId(truncate(MDC.get(RequestIdFilter.TRACE_ID), 64));\n            String query = request.getQueryString();\n            String detail = joinPoint.getSignature().toShortString() + \" | \" + request.getMethod()\n                    + \" \" + request.getRequestURI() + (query == null ? \"\" : \"?\" + query)\n                    + \" | \" + elapsedMs + \"ms\";\n            audit.setDetail(truncate(detail, 2000));\n            audit.setCreatedAt(LocalDateTime.now());\n            auditService.record(audit);\n        } catch (Exception e) {\n            log.error(\"写入管理端审计失败: action={} uri={}\",\n                    action, request.getRequestURI(), e);\n        }\n    }"

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const norm = (v) => { const l = Math.hypot(v[0],v[1],v[2]) || 1; return [v[0]/l,v[1]/l,v[2]/l]; };
const hash = (s) => { let h = 2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0); };
const hash01 = (s) => (hash(s) % 10000) / 10000;

/* 邻接表 */
const adj = new Map(NODES.map(n => [n.id, new Set()]));
const edgeList = [];
for (const [a,b,type] of EDGES) {
  if (!nodeMap.has(a) || !nodeMap.has(b)) { console.warn("bad edge", a, b); continue; }
  adj.get(a).add(b); adj.get(b).add(a);
  edgeList.push({ a, b, type, curve: (hash01(a+b+type) - .5) * 1.8 });
}

/* ═══════════════════════════════════════════════════════════════
   布局：每个系统 = 中心星 + 1~2 圈行星
   ═══════════════════════════════════════════════════════════════ */
const catNodes = new Map(CATS.map(c => [c.id, []]));
NODES.forEach(n => catNodes.get(n.cat).push(n));
NODES.forEach(n => {
  const c = catMap.get(n.cat);
  const peers = catNodes.get(n.cat);
  const i = peers.indexOf(n);
  const ci = catIndex.get(n.cat);
  if (i === 0) {
    n.pos = [...c.center];
    n.ring = 0;
    return;
  }
  const idx = i - 1;
  const ring = Math.floor(idx / 6);
  const within = idx % 6;
  const inRing = Math.min(6, peers.length - 1 - ring * 6);
  const angle = (within / Math.max(1, inRing)) * Math.PI * 2 + ring * 0.62 + ci * 0.47;
  const radius = 2.05 + ring * 1.45;
  n.pos = [
    c.center[0] + Math.cos(angle) * radius,
    c.center[1] + Math.sin(angle) * radius * 0.58 + (ring ? 0.25 : 0),
    c.center[2] + Math.sin(angle) * radius * 0.82 + (ring ? 0.55 : 0)
  ];
  n.ring = ring;
});
