name: Tests

# 每次 push / PR 都在一个全新的 Ubuntu 机器上跑完整测试套件。
# 价值在于「干净环境」：不依赖开发机上的 JDK 版本、本地 MySQL、.env 文件，
# 能在这里跑通才说明代码与配置真的自洽。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:        # 允许在 Actions 页面手动触发

jobs:
  test:
    runs-on: ubuntu-latest

    # 本项目的测试是「真连库、真连 Redis、真传 MinIO」的，
    # 所以要把这三个依赖也起起来 —— 端口映射到 localhost，
    # 正好与 application.yml 里的连接串一致，无需改任何应用配置。
    #
    # 库名是 its_mygo_test：测试跑在**独立的库**上（见 src/test/resources/application-test.yml），
    # 跟开发库分开，两边不互相踩。CI 里只跑测试、不跑应用，所以建这一个就够。
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: its_mygo_test
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    # MinIO 起不来：它在 2025 年停止了官方镜像与二进制的公开分发
    # （Docker Hub 的 minio/minio 返回 denied，dl.min.io 返回 410）。
    # 所以依赖 MinIO 的 StorageServiceTest 由 SKIP_MINIO_TESTS 跳过 —— 见下面 Run tests。

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        # 这些值只用于 CI 的测试环境，不是任何真实密钥。
        # 生产环境的凭据应该配成 GitHub Secrets 再从 secrets 上下文读，
        # 但这个项目的测试库是随容器起随容器销毁的，写死更省事、也更容易排查。
        env:
          DB_USERNAME: ci
          DB_PASSWORD: ci-password
          JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          # 见上方注释：MinIO 起不来，跳过依赖它的 StorageServiceTest
          SKIP_MINIO_TESTS: 'true'
        run: ./mvnw -B test

      - name: Upload test reports
        # 测试挂了也要把报告留下来，否则只能看日志猜是哪条用例失败
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
