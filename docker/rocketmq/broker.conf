# RocketMQ broker 配置（仅本地开发）
#
# brokerIP1 用容器名：proxy 在同一个 compose 网络里能解析它；
# 宿主机只连 proxy 的 8081，不直接连 broker，所以不需要改成 127.0.0.1。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
namesrvAddr = its-my-go-rocketmq-namesrv:9876
brokerIP1 = its-my-go-rocketmq-broker
listenPort = 10911

deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# 本地开发免手工建 topic / 订阅组
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 5.x 时间轮：支持任意时间的定时消息（超时关单靠它）
timerWheelEnable = true
