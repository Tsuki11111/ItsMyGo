server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 知识库 PDF 可能接近 200MB
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（买小购对话 / 聊天）不能缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # MinIO 与前端同源：数据库里只存 /its-my-go-product-images/... 相对路径，
    # 部署地址变化（DHCP 换 IP、换域名）时历史图片不会失效
    location /its-my-go-product-images/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 客服召回图片：前端把 RAG 返回的绝对地址转成 /rag-images/<bucket>/...，
    # 这里反代到 rag_helper 的 MinIO（宿主机 9002）；URL 不含主机名
    location /rag-images/ {
        proxy_pass http://host.docker.internal:9002/;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # 入口 HTML 不缓存：发版后浏览器立刻拿到新的资源清单，
    # 否则用户会一直用旧 bundle（改了样式也看不到）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 文件名带内容 hash，可以放心长缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
