spring:
  application:
    name: ItsMyGo
  # 凭据从项目根目录的 .env 读入（该文件已被 .gitignore 排除，绝不入库）
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/its_mygo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 共用 Redis 容器（本机多项目共用，本项目 key 一律以 its-mygo: 开头且必须带 TTL）
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

itsmygo:
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: 120
  # 复用本机共用 MinIO 实例，靠 bucket 与 rag_helper 隔离
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: its-my-go-product-images
  # 买小购客服智能体：内网 gRPC；密钥只放后端 .env
  agent:
    grpc:
      target: ${AGENT_GRPC_TARGET:127.0.0.1:8003}
      key: ${AGENT_GRPC_KEY:}
      deadline-seconds: ${AGENT_GRPC_DEADLINE_SECONDS:240}
    # 智能下单 / 退款动作：高危动作必须用户确认；expiry 是确认卡片的有效期
    actions:
      enabled: ${AGENT_ACTIONS_ENABLED:true}
      expiry-seconds: ${AGENT_ACTION_EXPIRY_SECONDS:600}
  # 虚拟物流：ETA = 最终送达时间；默认 120 分钟后送达（本地演示用，可调成 2 分钟看完整轨迹）
  logistics:
    delivery-minutes: ${LOGISTICS_DELIVERY_MINUTES:120}

# MyBatis-Plus 的 SQL 是运行时生成的，不开日志根本看不见
logging:
  level:
    com.tsuk1.itsmygo.mapper: debug
