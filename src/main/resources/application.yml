spring:
  application:
    name: ItsMyGo
  # 凭据从项目根目录的 .env 读入（该文件已被 .gitignore 排除，绝不入库）
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:3306/its_mygo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 共用 Redis 容器（本机多项目共用，本项目 key 一律以 its-mygo: 开头且必须带 TTL）
  data:
    redis:
      host: localhost
      port: 6379
  # 本项目自有的 RabbitMQ（超时关单）；账号放根目录 .env
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    connection-timeout: 3s
    listener:
      simple:
        auto-startup: ${ORDER_TIMEOUT_MQ_ENABLED:true}
  servlet:
    multipart:
      # 知识库 PDF 可能上百 MB；商品图等其它入口仍由 StorageService 单独限额
      max-file-size: 200MB
      max-request-size: 210MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

itsmygo:
  jwt:
    secret: ${JWT_SECRET}
    expire-minutes: 120
  # 管理端 RBAC（默认关闭 = 管理员拥有全部权限，兼容旧行为；灰度验证后再开）
  rbac:
    enabled: ${RBAC_ENABLED:false}
  # 复用本机共用 MinIO 实例，靠 bucket 与 rag_helper 隔离
  minio:
    # 后端连接地址（容器内可用 http://minio:9000）
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # 浏览器访问地址（容器部署时通常是宿主机端口，如 http://localhost:9000）
    # 默认同源相对路径：由前端 Nginx / Vite 反代到 MinIO，
    # 这样图片 URL 不含主机名，部署 IP 变化时历史数据不会失效
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:/}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: its-my-go-product-images
  # 买小购客服智能体：内网 gRPC；密钥只放后端 .env
  agent:
    grpc:
      target: ${AGENT_GRPC_TARGET:127.0.0.1:8003}
      key: ${AGENT_GRPC_KEY:}
      deadline-seconds: ${AGENT_GRPC_DEADLINE_SECONDS:240}
    # 智能体评测：管理端页面 → Java 代理 → rag_helper 8002（HTTP + JSON）
    # 密钥默认复用 agent 访问密钥；地址不用改时保持默认
    eval:
      url: ${AGENT_EVAL_URL:http://127.0.0.1:8002}
      key: ${AGENT_EVAL_KEY:${AGENT_GRPC_KEY:}}
    # 智能下单 / 退款动作：高危动作必须用户确认；expiry 是确认卡片的有效期
    actions:
      enabled: ${AGENT_ACTIONS_ENABLED:true}
      expiry-seconds: ${AGENT_ACTION_EXPIRY_SECONDS:600}
  # 知识库导入：管理员在 Java 管理端上传，Java 代理到 rag_helper 的 8001
  # 密钥默认复用 agent 访问密钥；地址不用改时保持默认
  knowledge:
    import-url: ${AGENT_IMPORT_URL:http://127.0.0.1:8001}
    key: ${AGENT_IMPORT_KEY:${AGENT_GRPC_KEY:}}
  # 管理员治理：首次部署引导账号 + 邀请有效期
  # bootstrap 只在库中没有活跃 ADMIN 时创建，已有管理员时绝不覆盖
  admin:
    bootstrap-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    invite-expiry-hours: ${ADMIN_INVITE_EXPIRY_HOURS:24}
  # 虚拟物流：ETA = 最终送达时间；默认 120 分钟后送达（本地演示用，可调成 2 分钟看完整轨迹）
  logistics:
    delivery-minutes: ${LOGISTICS_DELIVERY_MINUTES:120}
  # 超时未支付订单：MQ 定时消息准时关单 + 数据库扫描兜底
  order-timeout:
    minutes: ${ORDER_TIMEOUT_MINUTES:30}
    mq-enabled: ${ORDER_TIMEOUT_MQ_ENABLED:true}
    scan-enabled: ${ORDER_TIMEOUT_SCAN_ENABLED:true}
    scan-interval-ms: ${ORDER_TIMEOUT_SCAN_INTERVAL_MS:300000}
    scan-lock-ttl-seconds: ${ORDER_TIMEOUT_SCAN_LOCK_TTL_SECONDS:240}
  # 下单异步补账（M31 / D1）：async=false 退回同步补账（测试/无 MQ 环境）
  order-create:
    async: ${ORDER_CREATE_ASYNC:true}
    scan-enabled: ${ORDER_CREATE_SCAN_ENABLED:true}
    creating-timeout-seconds: ${ORDER_CREATE_TIMEOUT_SECONDS:120}
    scan-interval-ms: ${ORDER_CREATE_SCAN_INTERVAL_MS:60000}
    scan-lock-ttl-seconds: ${ORDER_CREATE_SCAN_LOCK_TTL_SECONDS:240}
    max-republish: ${ORDER_CREATE_MAX_REPUBLISH:3}
  # 智能推广：每天 10:00 给开启推广的顾客推 1 条商品；批量上限防一次扫太多人
  promotion:
    enabled: ${PROMOTION_ENABLED:true}
    # 登录后 0~N 秒随机延迟发送（不再用固定时间扫全量，避免瞬时尖峰）
    login-delay-seconds: ${PROMOTION_LOGIN_DELAY_SECONDS:300}
    batch-size: ${PROMOTION_BATCH_SIZE:200}
    # 一次推送最多带几件商品（卡片顺序与文案 ①②③ 对应）
    max-products: ${PROMOTION_MAX_PRODUCTS:3}
  # 售后（M30）：商家审核超时自动同意、退货超时自动确认收货；扫描式，无需 MQ
  after-sale:
    enabled: ${AFTER_SALE_SCAN_ENABLED:true}
    review-hours: ${AFTER_SALE_REVIEW_HOURS:48}
    return-confirm-days: ${AFTER_SALE_RETURN_CONFIRM_DAYS:7}
    scan-interval-ms: ${AFTER_SALE_SCAN_INTERVAL_MS:300000}
    scan-lock-ttl-seconds: ${AFTER_SALE_SCAN_LOCK_TTL_SECONDS:240}

# MyBatis-Plus 的 SQL 是运行时生成的，不开日志根本看不见
logging:
  level:
    com.tsuk1.itsmygo.mapper: debug
